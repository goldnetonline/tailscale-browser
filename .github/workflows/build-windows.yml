name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      # poetry.lock pins PyQt5-Qt5 5.15.17, which has no Windows wheels.
      # 5.15.2 is the only Qt build published for Windows and still satisfies PyQt5.
      - name: Install Windows runtime and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.15.0
          python -m pip install "PyQt5==5.15.11" "PyQtWebEngine==5.15.7"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          poetry build
          python -m PyInstaller --onedir --windowed --name "Tailscale Browser" \
            --icon=icon.ico \
            --paths src \
            --add-data "resources;resources" \
            --hidden-import PyQt5.QtWebEngineWidgets \
            --hidden-import PyQt5.sip \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module pandas \
            --exclude-module scipy \
            --exclude-module PIL.ImageTk \
            --exclude-module PIL.ImageQt \
            --optimize=2 \
            src/tailscale_browser/main.py
          mkdir -p release
          cp dist/tailscale_browser-*-py3-none-any.whl release/ || true
          cp dist/tailscale_browser-*.tar.gz release/ || true
          python -c 'import shutil; shutil.make_archive("release/Tailscale-Browser-Windows", "zip", "dist", "Tailscale Browser")'

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Tailscale-Browser-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
